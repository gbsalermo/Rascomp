name: Backend Tests

on:
  push:
    branches:
      - main
      - testes-automatizados
    paths:
      - 'rascomp/src/**'
      - 'rascomp/pom.xml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'rascomp/src/**'
      - 'rascomp/pom.xml'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: rascomp/pom.xml

      - name: Run unit tests
        working-directory: rascomp
        run: mvn -B test

  portal-testdata:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rascomp_b4_validation
          MYSQL_ROOT_PASSWORD: rascomp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent || mysqladmin ping -h 127.0.0.1 -prascomp_ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: rascomp/pom.xml

      - name: Compile application
        working-directory: rascomp
        run: mvn -B -DskipTests package

      - name: Boot Block 4.3 testdata and validate participant registration flow
        working-directory: rascomp
        env:
          TESTDATA_DB_URL: jdbc:mysql://127.0.0.1:3306/rascomp_b4_validation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: rascomp_ci
          JWT_SECRET: rascomp-b4-ci-secret-key-with-more-than-thirty-two-characters
          SPRING_PROFILES_ACTIVE: testdata
        run: |
          set -euo pipefail
          timeout 120s mvn -B spring-boot:run > portal-profile.log 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if grep -q "CENARIO PORTAL PRONTO" portal-profile.log; then
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application stopped before the Block 4.3 scenario was ready."
              cat portal-profile.log
              exit 1
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for the Block 4.3 testdata profile."
              cat portal-profile.log
              exit 1
            fi

            sleep 2
          done

          for marker in             "DEV: dev.b4@rascomp.local"             "GESTAO: gestao.b4@rascomp.local"             "LIDER: lider.b4@rascomp.local"             "MEMBRO: membro.b4@rascomp.local"             "Membro responsável por: B4 · Vespa"; do
            if ! grep -q "$marker" portal-profile.log; then
              echo "Block 4.3 profile missing expected marker: $marker"
              cat portal-profile.log
              exit 1
            fi
          done

          login() {
            curl -fsS               -H "Content-Type: application/json"               -d "{\"email\":\"$1\",\"senha\":\"Rascomp@2026\",\"lembrarDeMim\":false}"               http://127.0.0.1:8080/api/v1/auth/login
          }

          member_login=$(login "membro.b4@rascomp.local")
          leader_login=$(login "lider.b4@rascomp.local")
          management_login=$(login "gestao.b4@rascomp.local")

          echo "$member_login" | jq -e '.usuario.role == "PARTICIPANTE"' >/dev/null
          echo "$leader_login" | jq -e '.usuario.role == "PARTICIPANTE"' >/dev/null
          echo "$management_login" | jq -e '.usuario.role == "GESTAO"' >/dev/null

          member_token=$(echo "$member_login" | jq -r '.token')
          leader_token=$(echo "$leader_login" | jq -r '.token')
          management_token=$(echo "$management_login" | jq -r '.token')

          member_teams=$(curl -fsS             -H "Authorization: Bearer $member_token"             http://127.0.0.1:8080/api/v1/participante/equipes)
          team_id=$(echo "$member_teams" | jq -er '.[0].id')

          member_robots=$(curl -fsS             -H "Authorization: Bearer $member_token"             "http://127.0.0.1:8080/api/v1/participante/equipes/$team_id/robos")
          echo "$member_robots" | jq -e 'length == 1 and .[0].nome == "B4 · Vespa"' >/dev/null
          robot_id=$(echo "$member_robots" | jq -er '.[0].id')

          leader_robots=$(curl -fsS             -H "Authorization: Bearer $leader_token"             "http://127.0.0.1:8080/api/v1/participante/equipes/$team_id/robos")
          echo "$leader_robots" | jq -e 'length == 2' >/dev/null

          responsibles=$(curl -fsS             -H "Authorization: Bearer $member_token"             "http://127.0.0.1:8080/api/v1/participante/robos/$robot_id/responsaveis")
          competitor_ids=$(echo "$responsibles" | jq -c '[.[].competitorId]')
          echo "$competitor_ids" | jq -e 'length == 2' >/dev/null

          competitions=$(curl -fsS http://127.0.0.1:8080/api/v1/public/competicoes)
          competition_id=$(echo "$competitions" | jq -er '.[] | select(.status == "INSCRICOES_ABERTAS") | .id' | head -n 1)

          categories=$(curl -fsS http://127.0.0.1:8080/api/v1/public/categorias)
          category_id=$(echo "$categories" | jq -er '.[] | select(.modalidade == "FOLLOW_LINE") | .id' | head -n 1)

          payload=$(jq -nc             --argjson competitionId "$competition_id"             --argjson categoryId "$category_id"             --argjson robotId "$robot_id"             --argjson competitorIds "$competitor_ids"             '{competitionId:$competitionId,categoryId:$categoryId,robotId:$robotId,competitorIds:$competitorIds,observacao:"CI BLOCO 4.3"}')

          created=$(curl -fsS             -H "Authorization: Bearer $member_token"             -H "Content-Type: application/json"             -d "$payload"             "http://127.0.0.1:8080/api/v1/participante/equipes/$team_id/inscricoes")

          echo "$created" | jq -e '.status == "PENDENTE"' >/dev/null
          registration_id=$(echo "$created" | jq -er '.id')

          member_registrations=$(curl -fsS             -H "Authorization: Bearer $member_token"             "http://127.0.0.1:8080/api/v1/participante/equipes/$team_id/inscricoes")
          echo "$member_registrations" | jq -e --argjson id "$registration_id" 'any(.[]; .id == $id and .status == "PENDENTE")' >/dev/null

          public_before=$(curl -fsS             "http://127.0.0.1:8080/api/v1/public/inscricoes?competitionId=$competition_id")
          echo "$public_before" | jq -e --argjson id "$registration_id" 'all(.[]; .id != $id)' >/dev/null

          duplicate_code=$(curl -sS -o duplicate-response.json -w "%{http_code}"             -H "Authorization: Bearer $member_token"             -H "Content-Type: application/json"             -d "$payload"             "http://127.0.0.1:8080/api/v1/participante/equipes/$team_id/inscricoes")
          test "$duplicate_code" = "400"

          approval_payload=$(echo "$created" | jq '.status = "APROVADA"')
          approved=$(curl -fsS             -X PUT             -H "Authorization: Bearer $management_token"             -H "Content-Type: application/json"             -d "$approval_payload"             "http://127.0.0.1:8080/api/v1/inscricoes/$registration_id")
          echo "$approved" | jq -e '.status == "APROVADA"' >/dev/null

          public_after=$(curl -fsS             "http://127.0.0.1:8080/api/v1/public/inscricoes?competitionId=$competition_id")
          echo "$public_after" | jq -e --argjson id "$registration_id" 'any(.[]; .id == $id)' >/dev/null

          echo "Block 4.3 participant registration flow validated successfully."
          tail -n 80 portal-profile.log
