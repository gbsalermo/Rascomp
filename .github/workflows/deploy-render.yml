name: Deploy Render API

on:
  push:
    branches: [main]
    paths:
      - 'rascomp/**'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

concurrency:
  group: rascomp-render-api-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Verify Render deployment hook
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured as a GitHub Actions secret. API deployment was not triggered."
            exit 1
          fi
      - name: Trigger Render API deployment
        shell: bash
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 45 \
            -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
      - name: Confirm new CMS endpoint online
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            status=$(curl -LsS -m 15 -o /tmp/rascomp-cms.json -w '%{http_code}' \
              'https://api.rasufrb.site/api/v1/public/media/gallery' || true)
            if [ "$status" = "200" ] && grep -q '"photos"' /tmp/rascomp-cms.json; then
              echo "Render API is serving CMS snapshots."
              exit 0
            fi
            echo "Waiting for CMS deployment ($i/48; HTTP $status)"
            sleep 15
          done
          echo "::error::Render API did not expose the CMS within 12 minutes."
          exit 1
