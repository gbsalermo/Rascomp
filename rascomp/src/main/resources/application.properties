spring.application.name=Rascomp

# MySQL persistente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rascomp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hikari / transacoes
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - nunca versionar a chave real
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.security.jwt.remember-expiration-ms=${JWT_REMEMBER_EXPIRATION_MS:2592000000}

# Identidade/e-mail - V1-BETA B
# local/homologacao inicial: log. Producao: EMAIL_PROVIDER=resend.
app.email.provider=${EMAIL_PROVIDER:log}
app.email.from=${EMAIL_FROM:RasComp <no-reply@localhost>}
app.email.resend.api-key=${RESEND_API_KEY:}
app.identity.frontend-base-url=${IDENTITY_FRONTEND_BASE_URL:http://localhost:5173}
app.identity.email-verification-hours=${EMAIL_VERIFICATION_HOURS:24}
app.identity.password-reset-minutes=${PASSWORD_RESET_MINUTES:30}
app.identity.resend-cooldown-seconds=${IDENTITY_RESEND_COOLDOWN_SECONDS:60}

# CORS local / ambientes autorizados
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Primeiro usuario DEV (opcional). RASCOMP_ORG_* fica como fallback de compatibilidade.
rascomp.bootstrap.dev.nome=${RASCOMP_DEV_NOME:${RASCOMP_ORG_NOME:}}
rascomp.bootstrap.dev.email=${RASCOMP_DEV_EMAIL:${RASCOMP_ORG_EMAIL:}}
rascomp.bootstrap.dev.password=${RASCOMP_DEV_PASSWORD:${RASCOMP_ORG_PASSWORD:}}

# Cenário completo de demonstração local (opt-in; nunca habilitado por padrão)
rascomp.test-data.demo-showcase-enabled=${RASCOMP_DEMO_SHOWCASE_ENABLED:false}

# Fotos dos robos - armazenamento local atual permanece inalterado
app.storage.robot-images-dir=${ROBOT_IMAGES_DIR:./uploads/robots}

# Logos públicas das equipes - armazenamento local atual; caminho configurável por ambiente
app.storage.team-logos-dir=${TEAM_LOGOS_DIR:./uploads/team-logos}

# Comprovantes de inscrição - storage local atual; migrável pela camada de storage em etapa de produção.
app.storage.registration-receipts-dir=${REGISTRATION_RECEIPTS_DIR:./uploads/registration-receipts}

# Cloudflare R2 / S3 - reservado para galeria e midias futuras.
# Desativado por padrao para nao alterar nenhum fluxo atual.
app.storage.r2.enabled=${R2_ENABLED:false}
app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.endpoint=${R2_ENDPOINT:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# Limite global precisa comportar comprovantes (10 MB). Fotos continuam limitadas a 5 MB no RobotImageStorageService.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
