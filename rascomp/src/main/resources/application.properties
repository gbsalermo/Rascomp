spring.application.name=Rascomp

# MySQL persistente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rascomp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hikari / transacoes
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Camunda
camunda.bpm.database.schema-update=true

# JWT - nunca versionar a chave real
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Primeiro usuario da organizacao (opcional; usado apenas quando ainda nao existe ORGANIZACAO)
rascomp.bootstrap.organizacao.nome=${RASCOMP_ORG_NOME:}
rascomp.bootstrap.organizacao.email=${RASCOMP_ORG_EMAIL:}
rascomp.bootstrap.organizacao.password=${RASCOMP_ORG_PASSWORD:}

# Fotos dos robos
app.storage.robot-images-dir=${ROBOT_IMAGES_DIR:./uploads/robots}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
