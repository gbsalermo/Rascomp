# V1-BETA B — profile de execução cloud.
# Ative com SPRING_PROFILES_ACTIVE=cloud.

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Cloud não pode cair silenciosamente no MySQL local.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Logs SQL detalhados ficam desligados fora do desenvolvimento local.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Identidade e CORS precisam apontar para URLs reais do ambiente.
app.security.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.identity.frontend-base-url=${IDENTITY_FRONTEND_BASE_URL}

# Seeds/testdata: cloud nasce LIMPO. Nenhuma massa de QA pode ser criada.
rascomp.seed.base=false
rascomp.seed.postman=false
rascomp.test-data.bracket-history-enabled=false
rascomp.test-data.follow-line-enabled=false
rascomp.test-data.demo-showcase-enabled=false
rascomp.test-data.block3-validation-enabled=false
rascomp.test-data.block4-portal-validation-enabled=false

# OpenAPI fica fechado por padrão em cloud. Pode ser reabilitado de forma consciente.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Liveness do Render deve responder rapidamente sem consultar o MySQL/Aiven.
# Mantem /actuator/health para o health check configurado no Render.
# Liveness explicito: /actuator/health/liveness.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.health.db.enabled=false

# Pool menor no perfil cloud para economizar RAM e conexoes ao banco.
# Valores podem ser ajustados sem alterar os demais perfis.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# Mantem as tolerancias do Hikari para conexoes TLS remotas ao Aiven.
# Liveness nao usa o datasource; estes timeouts nao afetam o health check HTTP.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
