# Perfil local dedicado à validação manual da ETAPA 4 / BLOCO 3.
# Ative com SPRING_PROFILES_ACTIVE=testdata antes de iniciar o backend.
#
# Usa um banco separado para não misturar o QA atual com cenários antigos.
spring.datasource.url=${TESTDATA_DB_URL:jdbc:mysql://localhost:3306/rascomp_b3_validation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia}

# Desliga seeds antigos que criavam várias competições/cadastros paralelos.
rascomp.seed.base=false
rascomp.seed.postman=false
rascomp.test-data.bracket-history-enabled=false
rascomp.test-data.follow-line-enabled=false
rascomp.test-data.demo-showcase-enabled=false

# Único cenário ativo deste profile.
rascomp.test-data.block3-validation-enabled=true
