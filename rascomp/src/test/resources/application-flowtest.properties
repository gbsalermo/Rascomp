spring.datasource.url=jdbc:h2:mem:rascomp_flow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.security.jwt.secret=rascomp-flow-test-secret-key-with-more-than-thirty-two-characters
app.storage.r2.enabled=false
rascomp.test-data.demo-showcase-enabled=false
